<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // The theme, settled before anything is painted, so that a visitor in the dark never sees a white
      // page first. Their own choice if they have made one, else what their system is set to. It is kept
      // in step with vc/src/theme.ts, which takes over once the page is running.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('shrug-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.classList.add('th-' + theme)
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000')
      })()
    </script>
    <noscript>
      <!-- The menu's panel needs its script. Without one its two lines are not shown: the bar names the
           pages on a window wide enough, and on a narrower one they are linked from the footer. -->
      <style>
        .burger {
          display: none !important;
        }
      </style>
    </noscript>
    <!--head-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script>
      // Coming in. A hairline draws and words rise the first time they are seen (vc/src/styles.css,
      // "Coming in"). This says when: what is in view as the page opens plays at once, each thing in its
      // turn from the top; what is further down waits, and plays as it is scrolled to. It is here and not
      // in the site's own script so that it runs on the page as written, without waiting for that script
      // to arrive; the site calls it again when a visitor goes to another page (vc/src/App.tsx).
      // With no script at all, or for a visitor who has asked for less motion, the class js is never set:
      // nothing waits, and everything is there from the start.
      ;(function () {
        if (!('IntersectionObserver' in window)) return
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
        document.documentElement.classList.add('js')
        /** Whether the next things seen are the first of their page: those keep their turn, later ones play at once. */
        var first = true
        /** What is already being watched for. */
        var watched = new WeakSet()
        var seen = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return
              if (!first) entry.target.style.setProperty('--i', '0')
              entry.target.setAttribute('data-in', '')
              seen.unobserve(entry.target)
            })
            first = false
          },
          { rootMargin: '0px 0px -8% 0px' },
        )
        window.__shrugIn = function () {
          var fresh = 0
          Array.prototype.forEach.call(document.querySelectorAll('.rise:not([data-in]), .draw:not([data-in]), .row:not([data-in]), .card:not([data-in]), .tile:not([data-in])'), function (thing) {
            if (watched.has(thing)) return
            watched.add(thing)
            seen.observe(thing)
            fresh++
          })
          // Only a page newly arrived has things that take turns. With nothing new to watch for there is
          // nothing to say so about, and what is scrolled to next plays at once as before.
          if (fresh) first = true
        }
        window.__shrugIn()
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
