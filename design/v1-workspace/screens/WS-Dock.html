<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Dock icon takes your color</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shrugos.css">

<body>
<div class="board wall" style="width: 1180px; height: 380px">
<div class="dk"><div class="dock"><div class="dock__shelf"><span class="dock__item"><svg viewBox="0 0 100 100" class="app-icon" role="img" aria-label="Workspace, Scuderia Red"><rect width="100" height="100" rx="23" fill="#d8141c"/><text x="50" y="62" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="31" letter-spacing="-1.500" fill="#fff">W/S</text></svg></span><span class="dock__item"><svg viewBox="0 0 100 100" class="app-icon" role="img" aria-label="Workspace, Solar Orange"><rect width="100" height="100" rx="23" fill="#fb8a05"/><text x="50" y="62" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="31" letter-spacing="-1.500" fill="#141414">W/S</text></svg></span><span class="dock__item"><svg viewBox="0 0 100 100" class="app-icon" role="img" aria-label="Workspace, Alexandrite"><defs><linearGradient id="gdn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27307d"/><stop offset="0.5" stop-color="#6b3f9c"/><stop offset="1" stop-color="#b0683a"/></linearGradient></defs><rect width="100" height="100" rx="23" fill="url(#gdn)"/><text x="50" y="62" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="31" letter-spacing="-1.500" fill="#fff">W/S</text></svg></span><span class="dock__item"><svg viewBox="0 0 100 100" class="app-icon" role="img" aria-label="Workspace, Championship Green"><rect width="100" height="100" rx="23" fill="#0f9a48"/><text x="50" y="62" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="31" letter-spacing="-1.500" fill="#141414">W/S</text></svg></span><span class="dock__item"><svg viewBox="0 0 100 100" class="app-icon" role="img" aria-label="Workspace, Supersonic"><rect width="100" height="100" rx="23" fill="#9db3c9"/><text x="50" y="62" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="31" letter-spacing="-1.500" fill="#141414">W/S</text></svg></span><span class="dock__item"><svg viewBox="0 0 100 100" class="app-icon" role="img" aria-label="Workspace, Pearl Lavender"><rect width="100" height="100" rx="23" fill="#c4b5ea"/><text x="50" y="62" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="31" letter-spacing="-1.500" fill="#141414">W/S</text></svg></span><span class="dock__item"><svg viewBox="0 0 100 100" class="app-icon" role="img" aria-label="Workspace, Mantis Green"><rect width="100" height="100" rx="23" fill="#6fd12a"/><text x="50" y="62" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-weight="800" font-size="31" letter-spacing="-1.500" fill="#141414">W/S</text></svg></span></div></div><p>The Workspace icon in the Dock turns the color you picked, and stays that way on your next visit.</p></div>
</div>
